name: Publish to npm

on:
  push:
    tags:
      - 'v*'

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify npm supports Trusted Publishing
        run: |
          NPM_VERSION=$(npm --version)
          echo "Node $(node --version), npm ${NPM_VERSION}"
          NPM_MAJOR=${NPM_VERSION%%.*}
          if [ "$NPM_MAJOR" -lt 11 ]; then
            echo "::error::npm ${NPM_VERSION} is too old for Trusted Publishing (need >=11.5.1). Bump runner Node version."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Verify version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match git tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Verify
        run: npm run verify

      - name: Build
        run: npm run build

      - name: Publish (Trusted Publishing via OIDC)
        run: npm publish --access public
        env:
          NPM_CONFIG_PROVENANCE: 'true'
